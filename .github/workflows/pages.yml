name: Deploy FloodAid to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Restore recent public observations
        uses: actions/cache/restore@v4
        with:
          path: web/data
          key: floodaid-observations-${{ github.run_id }}
          restore-keys: floodaid-observations-
      - name: Refresh public source data
        run: npm run data:refresh
      - name: Refresh connected retailer inventory
        run: python scripts/refresh-inventory.py
        env:
          INVENTORY_PROVIDERS_JSON: ${{ secrets.INVENTORY_PROVIDERS_JSON }}
      - name: Verify application logic
        run: npm test
      - name: Build Pages
        run: npm run build
        env:
          GOOGLE_MAPS_BROWSER_KEY: ${{ secrets.GOOGLE_MAPS_BROWSER_KEY }}
      - uses: actions/cache/save@v4
        with:
          path: web/data
          key: floodaid-observations-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
